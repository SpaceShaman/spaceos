# Turn displays off after 5 minutes of inactivity and restore them on input.
exec swayidle -w timeout 300 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'

# Keep displays on while Firefox or VLC are visible in fullscreen mode.
for_window [app_id="firefox"] inhibit_idle fullscreen
for_window [app_id="vlc"] inhibit_idle fullscreen
