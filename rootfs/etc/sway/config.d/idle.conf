# Turn displays off after 5 minutes of inactivity and restore them on input.
exec swayidle -w timeout 300 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'

# Keep displays on while fullscreen windows are open.
for_window [class=".*"] inhibit_idle fullscreen
for_window [app_id=".*"] inhibit_idle fullscreen
