font sans 8
default_border pixel 1
default_floating_border pixel 1
gaps inner 0
gaps outer 0

client.focused          $theme_fg $theme_bg $theme_fg $theme_fg $theme_fg
client.focused_inactive $theme_bg $theme_bg $theme_fg $theme_bg $theme_bg
client.unfocused        $theme_bg $theme_bg $theme_fg $theme_bg $theme_bg
client.urgent           $theme_accent $theme_bg $theme_accent $theme_accent $theme_accent
client.placeholder      $theme_bg $theme_bg $theme_fg $theme_bg $theme_bg

output * bg #000000 solid_color

# Top bar: workspaces on the left, tray and system status on the right
bar {
    position top
    height 15
    font sans 10

    workspace_buttons yes
    binding_mode_indicator no
    separator_symbol " | "

    status_command /usr/libexec/spaceos-status

    tray_output *
    tray_padding 2

    colors {
        background         $theme_bg
        statusline         $theme_fg
        separator          $theme_fg

        focused_workspace  $theme_bg $theme_bg $theme_accent
        active_workspace   $theme_bg $theme_bg $theme_fg
        inactive_workspace $theme_bg $theme_bg $theme_fg
        urgent_workspace   $theme_accent $theme_accent $theme_bg
    }
}
