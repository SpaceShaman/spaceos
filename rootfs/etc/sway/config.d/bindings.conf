# Reload the configuration file
bindsym $mod+Shift+r reload

# Close focused window
bindsym $mod+q kill

# Application launcher
bindsym $mod+r exec rofi -config /etc/rofi/config.rasi -show drun

# Terminal
bindsym $mod+Return exec $term

# Browser
bindsym $mod+b exec firefox

# ChatGPT
bindsym $mod+g exec chatgpt

# Focus and move windows
bindsym $mod+a focus prev
bindsym $mod+f focus next
bindsym $mod+Shift+a move left
bindsym $mod+Shift+f move right

# Adjacent workspaces on the focused monitor; create one when needed.
bindsym $mod+s exec /etc/sway/config.d/workspace.sh focus prev
bindsym $mod+d exec /etc/sway/config.d/workspace.sh focus next
bindsym $mod+Shift+s exec /etc/sway/config.d/workspace.sh move prev
bindsym $mod+Shift+d exec /etc/sway/config.d/workspace.sh move next

# Focus monitors and move windows between them
bindsym $mod+j focus output left
bindsym $mod+semicolon focus output right
bindsym $mod+l focus output up
bindsym $mod+k focus output down
bindsym $mod+Shift+j move container to output left; focus output left
bindsym $mod+Shift+semicolon move container to output right; focus output right
bindsym $mod+Shift+l move container to output up; focus output up
bindsym $mod+Shift+k move container to output down; focus output down
