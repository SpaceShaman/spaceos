# Keep Bluetooth playback ready across pauses to avoid transport wake-up delays.
# Applies to headphones and speakers; microphones retain their default policy.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
